name: Preset Check
run-name: "Verify preset and blank QQ on ${{ github.ref_name }}"

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    # A local reusable workflow is resolved at this caller's exact commit,
    # so a branch check exercises that branch's build and validation code.
    uses: ./.github/workflows/main.yml
    with:
      force: true
      publish: false
    secrets: inherit
