name: Release
run-name: "Patch QQ #${{ github.run_number }}"

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 4"
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      qq_version:
        description: "自定义 QQ 版本号；留空使用 config.yml"
        type: string
        default: ""
      qq_url:
        description: "自定义 QQ arm64 APK 直链；须与版本号一起填写"
        type: string
        default: ""
      force:
        description: "即使版本未变也重新打包"
        type: boolean
        default: false
  workflow_call:
    inputs:
      qq_version:
        type: string
        default: ""
      qq_url:
        type: string
        default: ""
      force:
        type: boolean
        default: false
    secrets:
      CI_ARTIFACT_TOKEN:
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: mqga-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Resolve, build and verify six modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout MQGA
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test module resolution and embedded APK checks
        run: python3 -m unittest discover -s tests -v

      - name: Read config.yml
        uses: dcarbone/yaml-to-env-action@v3.0.1
        with:
          yaml-file: config.yml

      - name: Lock latest module, QQ and LSPatch sources
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN || github.token }}
          INPUT_QQ_VERSION: ${{ inputs.qq_version }}
          INPUT_QQ_URL: ${{ inputs.qq_url }}
          INPUT_FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/ci_modules.py resolve

      - name: Download the locked APKs and patcher
        if: steps.resolve.outputs.patch_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN || github.token }}
        run: python3 .github/scripts/ci_modules.py fetch

      - name: Keep downloaded modules and source provenance
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-modules-${{ github.run_id }}
          path: |
            modules/*.apk
            sources.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up JDK 17 for XAutoDaily
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: android-actions/setup-android@v3

      - name: Checkout exact XAutoDaily source and submodules
        if: steps.resolve.outputs.patch_needed == 'true' && steps.resolve.outputs.xad_enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: LuckyPray/XAutoDaily
          ref: ${{ steps.resolve.outputs.xad_sha }}
          path: upstream-xautodaily
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install XAutoDaily build dependencies
        if: steps.resolve.outputs.patch_needed == 'true' && steps.resolve.outputs.xad_enabled == 'true'
        run: |
          sdkmanager --install "platforms;android-32" "platforms;android-33" "build-tools;33.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build latest XAutoDaily source as Debug
        if: steps.resolve.outputs.patch_needed == 'true' && steps.resolve.outputs.xad_enabled == 'true'
        working-directory: upstream-xautodaily
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect XAutoDaily CI APK
        if: steps.resolve.outputs.patch_needed == 'true' && steps.resolve.outputs.xad_enabled == 'true'
        run: |
          mkdir -p modules
          cp upstream-xautodaily/app/build/outputs/apk/debug/app-debug.apk modules/XAutoDaily.apk

      - name: Keep XAutoDaily CI build
        if: steps.resolve.outputs.patch_needed == 'true' && steps.resolve.outputs.xad_enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xautodaily-ci-${{ steps.resolve.outputs.xad_sha }}
          path: modules/XAutoDaily.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK packages and write module manifest
        if: steps.resolve.outputs.patch_needed == 'true'
        id: modules
        run: python3 .github/scripts/ci_modules.py finalize

      - name: Set up JDK 21 for LSPatch
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch QQ with the verified module list
        if: steps.resolve.outputs.patch_needed == 'true'
        env:
          MODULE_LIST: ${{ steps.modules.outputs.module_list }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          apks = sorted(Path("inputs").glob("QQ-*.apk"))
          if not apks:
              raise SystemExit("No QQ APK was downloaded")
          subprocess.run([
              "java", "-jar", "LSPatch.jar", *map(str, apks),
              "-m", os.environ["MODULE_LIST"], "-l", "2", "-o", "dist",
          ], check=True)
          PY

      - name: Check every selected module is embedded byte-for-byte
        if: steps.resolve.outputs.patch_needed == 'true'
        run: python3 .github/scripts/ci_modules.py verify-patched --dist dist

      - name: Upload verified build
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: QQ-${{ steps.resolve.outputs.qq_version }}-${{ github.run_id }}
          path: |
            dist/*-lspatched.apk
            versions.json
            modules.json
            sources.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified QQ APK and provenance
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: Build-${{ github.run_number }}-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: "QQ ${{ steps.resolve.outputs.qq_version }} / Build #${{ github.run_number }}"
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*-lspatched.apk
            versions.json
            modules.json
            sources.json


