name: Release
run-name: "Patch QQ #${{ github.run_number }}"

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 4"
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      qq_version:
        description: "自定义 QQ 版本号；留空使用 config.yml"
        type: string
        default: ""
      qq_url:
        description: "自定义 QQ arm64 APK 直链；须与版本号一起填写"
        type: string
        default: ""
      force:
        description: "即使版本未变也重新打包"
        type: boolean
        default: false
      publish:
        description: "校验成功后发布两版 APK；关闭时只保存 Actions 产物"
        type: boolean
        default: true
  workflow_call:
    inputs:
      qq_version:
        type: string
        default: ""
      qq_url:
        type: string
        default: ""
      force:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
    secrets:
      CI_ARTIFACT_TOKEN:
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: mqga-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify preset and blank QQ
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout MQGA
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test source resolution and preset build checks
        run: python3 -m unittest discover -s tests -v

      - name: Read config.yml
        uses: dcarbone/yaml-to-env-action@v3.0.1
        with:
          yaml-file: config.yml

      - name: Lock latest module, QQ and LSPatch sources
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN || github.token }}
          INPUT_QQ_VERSION: ${{ inputs.qq_version }}
          INPUT_QQ_URL: ${{ inputs.qq_url }}
          INPUT_FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/ci_modules.py resolve

      - name: Download the locked APKs and patcher
        if: steps.resolve.outputs.patch_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN || github.token }}
        run: python3 .github/scripts/ci_modules.py fetch

      - name: Keep downloaded modules and source provenance
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-modules-${{ github.run_id }}
          path: |
            modules/*.apk
            sources.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up JDK 21 for LSPatch and Android tools
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK tools
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Verify APK packages and write module manifest
        if: steps.resolve.outputs.patch_needed == 'true'
        id: modules
        run: python3 .github/scripts/ci_modules.py finalize

      - name: Prepare the approved preset loader against exact input hashes
        if: steps.resolve.outputs.patch_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN || github.token }}
        run: python3 .github/scripts/ci_presets.py prepare

      - name: Build preset and blank APKs from the same locked inputs
        if: steps.resolve.outputs.patch_needed == 'true'
        run: python3 .github/scripts/ci_presets.py patch

      - name: Check every selected module is embedded byte-for-byte
        if: steps.resolve.outputs.patch_needed == 'true'
        run: python3 .github/scripts/ci_modules.py verify-patched --dist dist

      - name: Verify paired APK identities, signatures and loader differences
        if: steps.resolve.outputs.patch_needed == 'true'
        run: python3 .github/scripts/ci_presets.py verify

      - name: Upload both verified variants and their provenance
        if: steps.resolve.outputs.patch_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: QQ-${{ steps.resolve.outputs.qq_version }}-${{ github.run_id }}
          path: |
            dist/*.apk
            versions.json
            modules.json
            sources.json
            variants.json
            preset-effective.json
            preset-loader.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish both verified QQ variants and provenance
        # push/schedule have no inputs.publish; only an explicit Boolean false
        # suppresses publishing, including a reusable workflow invoked by push.
        if: steps.resolve.outputs.patch_needed == 'true' && toJSON(inputs.publish) != 'false'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: Build-${{ github.run_number }}-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: "QQ ${{ steps.resolve.outputs.qq_version }} / Build #${{ github.run_number }}"
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            versions.json
            modules.json
            sources.json
            variants.json
            preset-effective.json
            preset-loader.json
            SHA256SUMS


