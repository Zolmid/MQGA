name: Custom
run-name: "Patch custom QQ ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "自定义 QQ 版本号"
        required: true
        type: string
      link:
        description: "指定 QQ arm64 APK 下载直链"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  patch:
    uses: ./.github/workflows/main.yml
    with:
      qq_version: ${{ inputs.version }}
      qq_url: ${{ inputs.link }}
      force: true
    secrets: inherit

