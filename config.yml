# LSPatch 使用最新官方 Release，版本与下载资产会锁定到 sources.json。
LSPatch:
  repo: "JingMatrix/LSPatch"

# 六个模块：最新成功 CI 优先；未提供 APK CI 的项目使用以下明确来源。
# 这里控制是否打入 APK，不等于启用模块内部的全部功能。
modules:
  QAuxiliary: true # 默认分支成功 CI，arm64 release
  QFun: true # 最新官方发布 APK；上游未提供公开 APK CI
  QWish: true # 作者自动同步的最新官方发布 APK
  XAutoDaily: true # 最新官方发布 APK；不自行编译
  TSBattery: true # 默认分支成功 CI，legacy release
  ImPad: true # NKU100/ImPad 默认分支成功 CI，release APK

# 保留模块上游默认设置；自定义功能预设待配置清单确认。
# ImPad 没有内部开关，被加载后会自动尝试平板行为。
QQ:
  custom:
    enable: false
    version: "9.1.52"
    url: "https://downv6.qq.com/qqweb/QQ_1/android_apk/Android_9.1.52_64.apk"
  latest:
    enable: true

# 保留当前每次执行均打包的设置；false 时仅版本或构建配方变化后打包。
force:
  enable: true

